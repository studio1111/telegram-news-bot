name: Staging Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, compile and audit
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools==83.0.0"
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify setuptools version
        run: python -c "import setuptools; assert setuptools.__version__ == '83.0.0', setuptools.__version__"

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Audit dependencies
        run: pip-audit
