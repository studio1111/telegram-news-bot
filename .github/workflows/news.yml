name: News Bot

on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Restore deduplication state
        run: |
          git fetch --no-tags origin bot-state
          git show origin/bot-state:data/state.json > data/state.json

      - name: Publish news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_WINDOW_MINUTES: "90"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
        run: python -m app.main

      - name: Upload resulting state
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: news-state-${{ github.run_id }}
          path: data/state.json
          if-no-files-found: error
          retention-days: 2

  persist-state:
    if: always() && needs.publish.result != 'cancelled'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download resulting state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: news-state-${{ github.run_id }}
          path: state

      - name: Persist state to bot-state branch
        run: |
          set -euo pipefail
          test -s state/state.json

          git init state-repo
          cd state-repo
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch --no-tags origin bot-state
          git checkout --detach origin/bot-state
          cp ../state/state.json data/state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi

          git commit -m "chore: persist news state"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:bot-state

  cleanup:
    if: always()
    needs: [publish, persist-state]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep only the latest 15 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow news.yml --limit 100 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] || gh run delete "$run_id" || true
          done
