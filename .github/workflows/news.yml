name: News Bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/state.json"

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Publish news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_WINDOW_MINUTES: "90"
        run: python -m app.main

      - name: Persist deduplication state
        if: always()
        env:
          STATE_FILE: data/state.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "State file does not exist; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$STATE_FILE"
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi

          git commit -m "chore: persist news state"

          for attempt in 1 2 3 4 5; do
            echo "Persist attempt $attempt/5"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State persisted successfully."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to persist state after 5 attempts." >&2
          exit 1

      - name: Keep only the latest 15 workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow news.yml --limit 100 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] || gh run delete "$run_id" || true
          done
