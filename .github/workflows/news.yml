name: News Bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Restore deduplication state
        run: |
          git fetch --no-tags origin bot-state
          git show origin/bot-state:data/state.json > data/state.json

      - name: Publish news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_WINDOW_MINUTES: "90"
          GEMINI_MODEL: "gemini-3.5-flash-lite"
        run: python -m app.main

      - name: Persist deduplication state to protected-independent state branch
        if: always()
        run: |
          if [ ! -f data/state.json ]; then
            echo "State file does not exist; refusing to publish state."
            exit 1
          fi

          cp data/state.json /tmp/news-state.json
          git fetch --no-tags origin bot-state
          git checkout --detach origin/bot-state
          cp /tmp/news-state.json data/state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi

          git commit -m "chore: persist news state"
          git push origin HEAD:bot-state

  cleanup:
    if: always()
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep only the latest 15 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow news.yml --limit 100 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] || gh run delete "$run_id" || true
          done
